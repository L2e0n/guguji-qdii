<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fffdf2" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>QD鸡 · 咕咕鸡</title>
  <style>
    :root {
      --primary: #fbc02d;
      --secondary: #2c3e50;
      --up: #e74c3c;
      --down: #27ae60;
      --neutral: #999;
      --bg: #fffdf2;
      --card: #fff;
      --border: #ffecb3;
      --muted: #888;
      --text: #333;
      --open: #206c39;
      --limit: #9a6a00;
      --paused: #a34a2c;
      --unknown: #666;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 10px;
    }
    .app-container {
      max-width: 760px;
      margin: 0 auto;
      padding-bottom: 60px;
    }
    .header { text-align: center; margin-bottom: 15px; }
    .header h1 {
      color: var(--secondary);
      margin: 0;
      font-size: 22px;
    }
    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      color: #9a6a00;
      font-size: .85rem;
      font-weight: 700;
      text-decoration: none;
      background: #fff7d1;
      border: 1px solid #ffe58a;
      border-radius: 999px;
      padding: 6px 14px;
      box-shadow: 0 2px 8px rgba(251, 192, 45, 0.12);
      transition: .15s ease;
    }
    .home-link:hover {
      text-decoration: none;
      background: #fff1b8;
      border-color: var(--primary);
      transform: translateY(-1px);
    }
    .sub {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      margin-top: 8px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 8px 20px rgba(251, 192, 45, 0.05);
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    input[type="text"] {
      flex: 1 1 160px;
      min-width: 140px;
      background: #fff;
      border: 1px solid #ffe082;
      color: var(--text);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(251, 192, 45, 0.18); }
    .btn {
      padding: 9px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      background: var(--primary);
      color: #000;
      box-shadow: 0 4px 10px rgba(251, 192, 45, 0.25);
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
    .btn.secondary {
      background: #f5f5f5;
      color: #666;
      box-shadow: none;
      border: 1px solid #eee;
    }
    .btn.danger {
      background: transparent;
      color: var(--up);
      box-shadow: none;
      border: 1px solid #ffd2c7;
    }
    .btn.ghost {
      background: #fff7da;
      color: #8a6d1f;
      box-shadow: none;
      border: 1px solid #ffe082;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 4px 0 12px;
    }
    .sort-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .sort-bar .lbl {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }
    .sort-bar .btn {
      padding: 5px 10px;
      font-size: 11px;
      box-shadow: none;
    }
    .sort-bar .btn.active {
      background: var(--primary);
      color: #000;
      border-color: #f9a825;
      font-weight: 800;
    }
    .status-pill {
      background: #fff7da;
      border: 1px solid #ffe082;
      color: #8a6d1f;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
    }
    .status-pill.ok {
      background: #ecfff1;
      border-color: #b7e4c7;
      color: #206c39;
    }
    .status-pill.warn {
      background: #fff3f0;
      border-color: #ffd2c7;
      color: #a34a2c;
    }
    .list { display: flex; flex-direction: column; gap: 0; }
    .row1 {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .name-line {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
    }
    .name {
      font-weight: 800;
      font-size: 15px;
      line-height: 1.35;
      color: var(--secondary);
    }
    .metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      align-items: baseline;
      margin-top: 2px;
    }
    .metric {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      white-space: nowrap;
    }
    .metric b {
      font-weight: 800;
      color: var(--secondary);
      margin-left: 2px;
    }
    .metric .gz {
      margin-left: 2px;
    }
    .gz {
      font-size: 13px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .gz.up { color: var(--up); }
    .gz.down { color: var(--down); }
    .gz.neutral { color: var(--neutral); }
    .gz.pending { color: #bbb; font-weight: 600; font-size: 12px; }
    .code {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }
    .badge {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 800;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      min-width: 52px;
      max-width: 46%;
      text-align: center;
      font-variant-numeric: tabular-nums;
      line-height: 1.25;
      white-space: normal;
    }
    .badge.open {
      color: #206c39;
      background: #ecfff1;
      border-color: #b7e4c7;
    }
    .badge.limit {
      color: #000;
      background: var(--primary);
      border-color: #f9a825;
      box-shadow: 0 4px 10px rgba(251, 192, 45, 0.3);
    }
    .badge.paused {
      color: #a34a2c;
      background: #fff3f0;
      border-color: #ffd2c7;
    }
    .badge.unknown {
      color: #666;
      background: #f0f0f0;
      border-color: #e5e5e5;
    }
    .limit-num {
      margin-top: 12px;
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
      color: var(--secondary);
    }
    .limit-num small {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-left: 4px;
    }
    .desc {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .actions .btn { padding: 7px 12px; font-size: 12px; }
    .history {
      margin-top: 12px;
      border-top: 1px solid #fff3e0;
      padding-top: 10px;
      display: none;
    }
    .history.show { display: block; }
    .history h4 {
      margin: 0 0 8px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }
    .history ul { margin: 0; padding: 0; }
    .history li {
      list-style: none;
      font-size: 12px;
      color: var(--text);
      padding: 7px 0;
      border-bottom: 1px solid #fff8e1;
      line-height: 1.45;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 12px;
      border: 1px dashed var(--border);
      border-radius: 16px;
      background: #fff;
      margin-bottom: 12px;
    }
    .footer {
      text-align: center;
      padding: 24px 8px 10px;
      font-size: 11px;
      color: #bbb;
      line-height: 1.7;
    }
    .footer a { color: #b8860b; text-decoration: none; font-weight: 600; }
    .footer a:hover { text-decoration: underline; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: var(--secondary);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      z-index: 20;
      max-width: 90vw;
      box-shadow: 0 8px 20px rgba(0,0,0,.15);
    }
    .toast.show { opacity: 1; }
    .err { color: var(--up); font-size: 12px; margin-top: 6px; }
    .holdings {
      margin-top: 8px;
      padding: 8px 10px;
      background: #fffaf0;
      border: 1px solid #ffe082;
      border-radius: 10px;
      color: #5c4b16;
      font-size: 12px;
      line-height: 1.65;
    }
    .holdings .hl {
      color: #9a6a00;
      font-weight: 700;
      margin-right: 4px;
    }
    .holdings .asof {
      display: block;
      margin-top: 4px;
      color: #aaa;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <a class="home-link" href="https://guguji.icu" title="返回咕咕鸡大作战主页">← 返回主页</a>
      <h1>🐤 QD鸡</h1>
      <div class="sub">
        跟踪基金「申购状态 + 单日累计申购上限」（东财口径）。状态/限额变化会记录时间线。</div>
    </div>

    <div class="card toolbar">
      <input id="codeInput" type="text" inputmode="numeric" maxlength="6" placeholder="输入6位基金代码，如 016664" />
      <button id="addBtn" class="btn" type="button">添加自选</button>
      <button id="refreshBtn" class="btn secondary" type="button">刷新全部</button>
      <button id="exportBtn" class="btn ghost" type="button" title="导出代码+名称，便于换设备">导出列表</button>
      <button id="importBtn" class="btn ghost" type="button" title="从文本文件导入基金代码">导入列表</button>
      <input id="importFile" type="file" accept=".txt,.csv,text/plain" hidden />
    </div>

    <div class="meta">
      <span id="statusText" class="status-pill">准备就绪</span>
      <div class="sort-bar" id="sortBar" title="按单日购买限额排序">
        <span class="lbl">按限额</span>
        <button type="button" class="btn secondary" data-sort="limit-asc">升序</button>
        <button type="button" class="btn secondary" data-sort="limit-desc">降序</button>
        <button type="button" class="btn secondary" data-sort="default">默认</button>
      </div>
    </div>

    <div id="list" class="list"></div>
    <div id="empty" class="empty" hidden>还没有自选，先添加一只基金到 QD鸡 吧</div>

    <div class="footer">
      数据源：东方财富 · 缓存约 60 秒<br/>
      QD鸡 · qdii.guguji.icu · 估值同源 ji.guguji.icu · v0.1.10
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    const API_BASE = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
      ? "http://127.0.0.1:5000"
      : "https://ocr.guguji.icu";
    const STORAGE_KEY = "qdii_watchlist_v1";
    const DEFAULT_CODES = ["016664", "539002"];

    const $ = (id) => document.getElementById(id);
    const listEl = $("list");
    const emptyEl = $("empty");
    const statusText = $("statusText");
    const toastEl = $("toast");

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    function setStatus(msg, kind) {
      statusText.textContent = msg;
      statusText.classList.remove("ok", "warn");
      if (kind) statusText.classList.add(kind);
    }

    function loadWatchlist() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [...DEFAULT_CODES];
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr) || !arr.length) return [...DEFAULT_CODES];
        return arr.filter((c) => /^\d{6}$/.test(c));
      } catch {
        return [...DEFAULT_CODES];
      }
    }

    function saveWatchlist(codes) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(codes));
    }

    function exportWatchlistFile() {
      if (!watchlist.length) {
        toast("自选为空，无需导出");
        return;
      }
      const map = new Map((lastItems || []).map((i) => [i.code, i]));
      const lines = watchlist.map((code) => {
        const item = map.get(code);
        const name = item && item.name ? String(item.name).replace(/[\r\n]+/g, " ").trim() : "";
        return name ? (code + " " + name) : code;
      });
      const body = "# QD鸡自选列表  每行: 代码 名称\n" + lines.join("\n") + "\n";
      const blob = new Blob([body], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      const d = new Date();
      const stamp = d.getFullYear()
        + String(d.getMonth() + 1).padStart(2, "0")
        + String(d.getDate()).padStart(2, "0");
      a.href = URL.createObjectURL(blob);
      a.download = "qdii-watchlist-" + stamp + ".txt";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast("已导出 " + watchlist.length + " 只基金");
    }

    function parseImportText(text) {
      const codes = [];
      const seen = new Set();
      String(text || "").split(/\r?\n/).forEach((line) => {
        const s = line.trim();
        if (!s || s.startsWith("#")) return;
        // 支持: 016664 名称 | 016664,名称 | 016664\t名称 | 仅代码
        let m = s.match(/^(\d{6})\b/);
        if (!m) m = s.match(/(?:^|[,;\s])(\d{6})(?:$|[,;\s])/);
        if (!m) return;
        const code = m[1];
        if (seen.has(code)) return;
        seen.add(code);
        codes.push(code);
      });
      return codes;
    }

    async function importWatchlistFromFile(file) {
      if (!file) return;
      let text = "";
      try {
        text = await file.text();
      } catch (e) {
        toast("读取文件失败");
        return;
      }
      const codes = parseImportText(text);
      if (!codes.length) {
        toast("文件中未识别到基金代码");
        return;
      }
      if (!confirm("识别到 " + codes.length + " 只基金，是否导入？")) {
        toast("已取消导入");
        return;
      }
      const replace = confirm(
        "导入方式：\n\n"
        + "确定 = 替换当前自选（适合换设备）\n"
        + "取消 = 合并到当前自选（跳过已有）"
      );
      if (replace) {
        watchlist = codes;
        saveWatchlist(watchlist);
        toast("已替换为 " + codes.length + " 只");
      } else {
        let added = 0;
        codes.forEach((c) => {
          if (!watchlist.includes(c)) {
            watchlist.push(c);
            added += 1;
          }
        });
        saveWatchlist(watchlist);
        toast(added ? ("合并完成，新增 " + added + " 只") : "合并完成，无新增（均已在自选中）");
      }
      await refreshAll(true);
    }

    let watchlist = loadWatchlist();
    const historyOpen = new Set();
    const SORT_KEY = "qdii_sort_v1";
    let lastItems = [];
    let sortMode = (function () {
      try {
        const v = localStorage.getItem(SORT_KEY);
        if (v === "limit-asc" || v === "limit-desc" || v === "default") return v;
      } catch (_) {}
      return "default";
    })();

    function saveSortMode(mode) {
      sortMode = mode;
      try { localStorage.setItem(SORT_KEY, mode); } catch (_) {}
      syncSortButtons();
    }

    function syncSortButtons() {
      const bar = document.getElementById("sortBar");
      if (!bar) return;
      bar.querySelectorAll("button[data-sort]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.sort === sortMode);
        btn.classList.toggle("secondary", btn.dataset.sort !== sortMode);
      });
    }

    /** 限额数值排序键：暂停=0，有上限用数字，开放无上限=Infinity，未知/失败=null(排后) */
    function limitSortKey(item) {
      if (!item || item.ok === false || item.error) return null;
      const norm = item.sgzt_norm;
      if (norm === "paused") return 0;
      const amount = item.limit_amount;
      if (amount === null || amount === undefined || amount === "") {
        if (norm === "open") return Number.POSITIVE_INFINITY;
        return null;
      }
      const n = Number(amount);
      if (!Number.isFinite(n)) return null;
      return n;
    }

    function orderedCodesForRender(map) {
      const codes = [...watchlist];
      if (sortMode === "default") return codes;
      const dir = sortMode === "limit-asc" ? 1 : -1;
      return codes.sort((a, b) => {
        const ka = limitSortKey(map.get(a));
        const kb = limitSortKey(map.get(b));
        const aNull = ka === null || ka === undefined;
        const bNull = kb === null || kb === undefined;
        if (aNull && bNull) return watchlist.indexOf(a) - watchlist.indexOf(b);
        if (aNull) return 1;
        if (bNull) return -1;
        if (ka === kb) return watchlist.indexOf(a) - watchlist.indexOf(b);
        return ka < kb ? -dir : dir;
      });
    }

    function formatAmountCompact(amount) {
      if (amount === null || amount === undefined || amount === "") return null;
      const n = Number(amount);
      if (!Number.isFinite(n)) return String(amount);
      if (n === 0) return "0";
      if (n >= 10000 && n % 10000 === 0) return String(n / 10000) + "万";
      if (Number.isInteger(n)) return String(n);
      return n.toFixed(2).replace(/\.?0+$/, "");
    }

    function formatPct(pct) {
      if (pct === null || pct === undefined || pct === "") return "--";
      const n = Number(pct);
      if (!Number.isFinite(n)) return String(pct);
      const s = n.toFixed(2).replace(/\.0+$/, "").replace(/(\.[0-9]*?)0+$/, "$1");
      return s;
    }

    function formatHoldingsHtml(holdings) {
      const items = (holdings && Array.isArray(holdings.items)) ? holdings.items : [];
      if (!items.length) return "";
      const n = items.length;
      const label = n >= 10 ? "前十大重仓" : (n >= 5 ? "前五大重仓" : "重仓股");
      const body = items.map((x) => {
        const name = escapeHtml(x.name || x.code || "--");
        const pct = escapeHtml(formatPct(x.pct));
        return `${name}（${pct}%）`;
      }).join(" · ");
      const asof = holdings.as_of ? `<span class="asof">持仓报告期：${escapeHtml(holdings.as_of)}</span>` : "";
      return `<div class="holdings"><span class="hl">${label}</span>${body}${asof}</div>`;
    }

    function formatLimit(amount, norm) {
      if (norm === "paused") return { main: "暂停申购", unit: "" };
      if (amount === null || amount === undefined) {
        if (norm === "open") return { main: "基本开放", unit: "无明确上限" };
        return { main: "—", unit: "" };
      }
      if (amount === 0) return { main: "0", unit: "元" };
      if (amount >= 10000 && amount % 10000 === 0) {
        return { main: String(amount / 10000), unit: "万元" };
      }
      const n = Number(amount);
      const s = Number.isInteger(n) ? String(n) : n.toFixed(2);
      return { main: s, unit: "元" };
    }

    function badgeClass(norm) {
      if (norm === "open") return "open";
      if (norm === "limit") return "limit";
      if (norm === "paused") return "paused";
      return "unknown";
    }

    // 黄色/状态徽章：合并限额文案，例如「单日购买限额100元」
    function badgeText(item) {
      const norm = item.sgzt_norm;
      const amount = item.limit_amount;

      if (norm === "paused") return "暂停申购";

      if (amount !== null && amount !== undefined && amount !== "") {
        const n = Number(amount);
        if (Number.isFinite(n)) {
          if (n <= 0 && norm === "paused") return "暂停申购";
          if (n >= 10000 && n % 10000 === 0) {
            return `单日购买限额${n / 10000}万元`;
          }
          const s = Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/\.?0+$/, "");
          return `单日购买限额${s}元`;
        }
      }

      if (norm === "open") return "开放申购";
      if (norm === "limit") return "限大额";
      if (item.sgzt) return item.sgzt;
      return "未知";
    }

    function formatNavNum(v) {
      const n = Number(v);
      if (!Number.isFinite(n) || n <= 0) return null;
      return n.toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
    }

    // 同时显示：最近净值 + 当日估值预估（QDII 常无实时估值）
    function formatGzHtml(gz, item) {
      const nav = formatNavNum(gz && !gz.error ? gz.dwjz : null) || formatNavNum(item && item.dwjz);
      const navDate = (gz && (gz.jzrq || "")) || (item && (item.fsrq || "")) || "";
      const gsz = formatNavNum(gz && !gz.error ? gz.gsz : null);
      const pct = gz && !gz.error ? Number(gz.gszzl) : NaN;
      const hasPct = Number.isFinite(pct);
      const dayPct = item && item.rzdf != null && item.rzdf !== "" ? Number(item.rzdf) : NaN;
      const hasDay = Number.isFinite(dayPct);
      const cls = !hasPct ? "pending" : (Math.abs(pct) < 0.0005 ? "neutral" : (pct > 0 ? "up" : "down"));
      const dayCls = !hasDay ? "pending" : (Math.abs(dayPct) < 0.0005 ? "neutral" : (dayPct > 0 ? "up" : "down"));
      const sign = hasPct && pct > 0 ? "+" : "";
      const daySign = hasDay && dayPct > 0 ? "+" : "";
      const pctText = hasPct ? `${sign}${pct.toFixed(2)}%` : "--";
      const gszTitle = escapeHtml([
        gsz ? `估算净值 ${gsz}` : "",
        gz && gz.gztime ? `估值时间 ${gz.gztime}` : "",
        !hasPct ? "QDII 常无盘中实时估值" : "",
      ].filter(Boolean).join(" · "));

      let navExtra = "";
      if (navDate) {
        navExtra += `<span style="color:#bbb;font-size:11px;margin-left:3px">${escapeHtml(navDate)}</span>`;
      }
      if (!hasPct && hasDay) {
        navExtra += ` <span class="gz ${dayCls}" title="最近公布日涨跌幅">${daySign}${dayPct.toFixed(2)}%</span>`;
      }

      const navHtml = nav
        ? `<span class="metric" title="${escapeHtml(navDate ? "净值日期 " + navDate : "最近公布净值")}">净值<b>${escapeHtml(nav)}</b>${navExtra}</span>`
        : `<span class="metric">净值<b>--</b></span>`;

      const gzHtml = (gsz || hasPct)
        ? `<span class="metric" title="${gszTitle}">估值${gsz ? `<b>${escapeHtml(gsz)}</b>` : ""} <span class="gz ${cls}">${pctText}</span></span>`
        : `<span class="metric" title="${gszTitle}">估值 <span class="gz pending">暂无</span></span>`;

      return `<div class="metrics">${navHtml}${gzHtml}</div>`;
    }

    async function fetchWithTimeout(url, opts = {}, timeoutMs = 15000) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        return await fetch(url, { ...opts, signal: ctrl.signal, cache: "no-store" });
      } finally {
        clearTimeout(timer);
      }
    }

    function humanFetchError(e) {
      if (!e) return "网络错误";
      if (e.name === "AbortError") return "请求超时";
      const msg = e.message || String(e);
      if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) return "网络异常，稍后重试";
      return msg;
    }

    async function fetchFundGz(code) {
      try {
        const res = await fetchWithTimeout(`${API_BASE}/api/fundgz/${code}`, {}, 10000);
        const raw = await res.text();
        let data = null;
        try {
          data = raw ? JSON.parse(raw) : null;
        } catch (_) {
          // Cloudflare 等可能返回纯文本 502
          return { error: `no_valuation_http_${res.status}` };
        }
        if (!data || !data.ok) {
          return { error: (data && data.error) || `HTTP ${res.status}` };
        }
        return {
          gszzl: data.gszzl,
          gsz: data.gsz,
          dwjz: data.dwjz,
          jzrq: data.jzrq || "",
          gztime: data.gztime || "",
          channel: data.channel || "",
        };
      } catch (e) {
        return { error: humanFetchError(e) };
      }
    }

    async function attachValuations(items) {
      const list = Array.isArray(items) ? items : [];
      await Promise.all(list.map(async (item) => {
        if (!item || item.ok === false || item.error) {
          item.gz = null;
          return;
        }
        item.gz = await fetchFundGz(item.code);
      }));
      return list;
    }

    async function fetchBatch(codes, refresh = false) {
      const q = new URLSearchParams({ codes: codes.join(",") });
      if (refresh) q.set("refresh", "1");
      const url = `${API_BASE}/api/qdii/batch?${q}`;
      let lastErr;
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          const res = await fetchWithTimeout(url, {}, 18000);
          const raw = await res.text();
          let data = null;
          try {
            data = raw ? JSON.parse(raw) : null;
          } catch (_) {
            throw new Error(res.ok ? "响应不是 JSON" : `HTTP ${res.status}`);
          }
          if (!res.ok || !data || !data.ok) {
            throw new Error((data && data.error) || `HTTP ${res.status}`);
          }
          return data.items || [];
        } catch (e) {
          lastErr = e;
          if (attempt === 0) {
            await new Promise((r) => setTimeout(r, 700));
          }
        }
      }
      throw lastErr;
    }

    async function fetchHistory(code) {
      const res = await fetch(`${API_BASE}/api/qdii/${code}/history?limit=20`, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "history failed");
      return data.items || [];
    }

    function render(items) {
      if (Array.isArray(items)) lastItems = items;
      const map = new Map((lastItems || []).map((i) => [i.code, i]));
      listEl.innerHTML = "";
      emptyEl.hidden = watchlist.length > 0;
      if (!watchlist.length) return;

      const codes = orderedCodesForRender(map);
      for (const code of codes) {
        const item = map.get(code) || { code, ok: false, error: "无数据" };
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.code = code;

        if (item.error || item.ok === false) {
          card.innerHTML = `
            <div class="row1">
              <div>
                <div class="name">加载失败</div>
                <div class="code">${code}</div>
              </div>
              <span class="badge unknown">错误</span>
            </div>
            <div class="err">${escapeHtml(item.error || "unknown error")}</div>
            <div class="actions">
              <button type="button" class="btn" data-act="retry">重试</button>
              <button type="button" class="btn danger" data-act="remove">移除</button>
            </div>`;
        } else {
          const bc = badgeClass(item.sgzt_norm);
          const badgeTitle = [item.sgzt, item.limit_text].filter(Boolean).join(" · ");
          card.innerHTML = `
            <div class="row1">
              <div style="min-width:0;flex:1">
                <div class="name-line">
                  <span class="name">${escapeHtml(item.name || "未知基金")}</span>
                </div>
                ${formatGzHtml(item.gz, item)}
                <div class="code">${code}${item.ftype ? " · " + escapeHtml(item.ftype) : ""}</div>
              </div>
              <span class="badge ${bc}" title="${escapeHtml(badgeTitle || item.sgzt_norm || "")}">${escapeHtml(badgeText(item))}</span>
            </div>
            ${formatHoldingsHtml(item.holdings)}
            <div class="desc">更新：${escapeHtml(item.updated_at || "-")}${item.cached ? " · 缓存" : ""}${item.source ? " · " + escapeHtml(item.source) : ""}</div>
            <div class="actions">
              <button type="button" class="btn secondary" data-act="history">变更记录</button>
              <button type="button" class="btn secondary" data-act="retry">刷新</button>
              <button type="button" class="btn danger" data-act="remove">移除</button>
            </div>
            <div class="history ${historyOpen.has(code) ? "show" : ""}" data-history></div>`;
        }

        card.addEventListener("click", async (ev) => {
          const btn = ev.target.closest("button[data-act]");
          if (!btn) return;
          const act = btn.dataset.act;
          if (act === "remove") {
            watchlist = watchlist.filter((c) => c !== code);
            saveWatchlist(watchlist);
            toast("已移除 " + code);
            await refreshAll(false);
          } else if (act === "retry") {
            await refreshOne(code);
          } else if (act === "history") {
            const box = card.querySelector("[data-history]");
            if (historyOpen.has(code)) {
              historyOpen.delete(code);
              box.classList.remove("show");
              return;
            }
            historyOpen.add(code);
            box.classList.add("show");
            box.innerHTML = "<h4>变更记录</h4><div class='desc'>加载中…</div>";
            try {
              const rows = await fetchHistory(code);
              if (!rows.length) {
                box.innerHTML = "<h4>变更记录</h4><div class='desc'>暂无历史（首次观察会记一条基线）</div>";
              } else {
                const lis = rows.map((r) => {
                  const lim = r.limit_amount == null ? "无上限/开放" : (r.limit_amount + "元");
                  const prev = r.prev_sgzt != null
                    ? `（前：${r.prev_sgzt || "-"} / ${r.prev_limit_amount == null ? "-" : r.prev_limit_amount + "元"}）`
                    : "";
                  return `<li>${escapeHtml(r.changed_at || "")} · ${escapeHtml(r.sgzt || r.sgzt_norm || "")} · ${escapeHtml(String(lim))} ${escapeHtml(prev)}</li>`;
                }).join("");
                box.innerHTML = `<h4>变更记录</h4><ul>${lis}</ul>`;
              }
            } catch (e) {
              box.innerHTML = `<h4>变更记录</h4><div class="err">${escapeHtml(e.message)}</div>`;
            }
          }
        });

        listEl.appendChild(card);
      }
    }

    function escapeHtml(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    async function refreshAll(force = true) {
      if (!watchlist.length) {
        render([]);
        setStatus("自选为空");
        return;
      }
      setStatus(force ? "刷新中…" : "同步中…");
      $("refreshBtn").disabled = true;
      try {
        const items = await fetchBatch(watchlist, force);
        // 估值失败不阻断主数据；额度/净值已够用
        await attachValuations(items);
        render(items);
        const okCount = items.filter((i) => i && i.ok !== false && !i.error).length;
        const noGz = items.filter((i) => i && i.ok !== false && !i.error && (!i.gz || i.gz.error || !i.gz.gsz)).length;
        const t = new Date().toLocaleTimeString();
        if (okCount === 0) {
          setStatus("刷新失败: 无有效数据", "warn");
        } else if (noGz > 0) {
          setStatus(`已更新 ${t}（${noGz} 只暂无实时估值）`, "ok");
        } else {
          setStatus("已更新 " + t, "ok");
        }
      } catch (e) {
        const msg = humanFetchError(e);
        setStatus("刷新失败: " + msg, "warn");
        toast("刷新失败: " + msg);
        render(watchlist.map((code) => ({ code, ok: false, error: msg })));
      } finally {
        $("refreshBtn").disabled = false;
      }
    }

    async function refreshOne(code) {
      setStatus("刷新 " + code + "…");
      try {
        const res = await fetchWithTimeout(`${API_BASE}/api/qdii/${code}?refresh=1`, {}, 18000);
        const raw = await res.text();
        let data = null;
        try { data = raw ? JSON.parse(raw) : null; } catch (_) { throw new Error(`HTTP ${res.status}`); }
        if (!data || !data.ok) throw new Error((data && data.error) || "failed");
        await refreshAll(false);
        toast(code + " 已刷新");
      } catch (e) {
        const msg = humanFetchError(e);
        toast("刷新失败: " + msg);
        setStatus("刷新失败: " + msg, "warn");
      }
    }

    $("addBtn").addEventListener("click", async () => {
      const code = $("codeInput").value.trim();
      if (!/^\d{6}$/.test(code)) {
        toast("请输入6位基金代码");
        return;
      }
      if (watchlist.includes(code)) {
        toast("已在自选中");
        return;
      }
      watchlist.unshift(code);
      saveWatchlist(watchlist);
      $("codeInput").value = "";
      await refreshAll(true);
      toast("已添加 " + code);
    });

    $("codeInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("addBtn").click();
    });
    $("refreshBtn").addEventListener("click", () => refreshAll(true));
    $("exportBtn").addEventListener("click", () => exportWatchlistFile());
    $("importBtn").addEventListener("click", () => $("importFile").click());
    $("importFile").addEventListener("change", async (ev) => {
      const file = ev.target.files && ev.target.files[0];
      ev.target.value = "";
      await importWatchlistFromFile(file);
    });

    $("sortBar").addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-sort]");
      if (!btn) return;
      const mode = btn.dataset.sort;
      if (!mode || mode === sortMode) return;
      saveSortMode(mode);
      render(lastItems);
      const label = mode === "limit-asc" ? "限额升序（低→高）"
        : mode === "limit-desc" ? "限额降序（高→低）"
        : "默认顺序";
      toast("已按" + label + "排列");
    });

    // boot
    syncSortButtons();
    refreshAll(true);
    // soft auto refresh every 3 min
    setInterval(() => refreshAll(false), 180000);
  </script>
</body>
</html>
