<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fffdf2" />
  <title>QDII额度宝 · 咕咕鸡</title>
  <style>
    :root {
      --primary: #fbc02d;
      --secondary: #2c3e50;
      --up: #e74c3c;
      --down: #27ae60;
      --neutral: #999;
      --bg: #fffdf2;
      --card: #fff;
      --border: #ffecb3;
      --muted: #888;
      --text: #333;
      --open: #206c39;
      --limit: #9a6a00;
      --paused: #a34a2c;
      --unknown: #666;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 10px;
    }
    .app-container {
      max-width: 760px;
      margin: 0 auto;
      padding-bottom: 60px;
    }
    .header { text-align: center; margin-bottom: 15px; }
    .header h1 {
      color: var(--secondary);
      margin: 0;
      font-size: 22px;
    }
    .home-link {
      display: inline-flex;
      margin-bottom: 10px;
      color: #b45309;
      font-size: .85rem;
      font-weight: 600;
      text-decoration: none;
    }
    .home-link:hover { text-decoration: underline; }
    .sub {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      margin-top: 8px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 8px 20px rgba(251, 192, 45, 0.05);
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    input[type="text"] {
      flex: 1 1 160px;
      min-width: 140px;
      background: #fff;
      border: 1px solid #ffe082;
      color: var(--text);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(251, 192, 45, 0.18); }
    .btn {
      padding: 9px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      background: var(--primary);
      color: #000;
      box-shadow: 0 4px 10px rgba(251, 192, 45, 0.25);
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
    .btn.secondary {
      background: #f5f5f5;
      color: #666;
      box-shadow: none;
      border: 1px solid #eee;
    }
    .btn.danger {
      background: transparent;
      color: var(--up);
      box-shadow: none;
      border: 1px solid #ffd2c7;
    }
    .btn.ghost {
      background: #fff7da;
      color: #8a6d1f;
      box-shadow: none;
      border: 1px solid #ffe082;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 4px 0 12px;
    }
    .status-pill {
      background: #fff7da;
      border: 1px solid #ffe082;
      color: #8a6d1f;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
    }
    .status-pill.ok {
      background: #ecfff1;
      border-color: #b7e4c7;
      color: #206c39;
    }
    .status-pill.warn {
      background: #fff3f0;
      border-color: #ffd2c7;
      color: #a34a2c;
    }
    .list { display: flex; flex-direction: column; gap: 0; }
    .row1 {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .name {
      font-weight: 800;
      font-size: 15px;
      line-height: 1.35;
      color: var(--secondary);
    }
    .code {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }
    .badge {
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      min-width: 52px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .badge.open {
      color: #206c39;
      background: #ecfff1;
      border-color: #b7e4c7;
    }
    .badge.limit {
      color: #000;
      background: var(--primary);
      border-color: #f9a825;
      box-shadow: 0 4px 10px rgba(251, 192, 45, 0.3);
    }
    .badge.paused {
      color: #a34a2c;
      background: #fff3f0;
      border-color: #ffd2c7;
    }
    .badge.unknown {
      color: #666;
      background: #f0f0f0;
      border-color: #e5e5e5;
    }
    .limit-num {
      margin-top: 12px;
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
      color: var(--secondary);
    }
    .limit-num small {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-left: 4px;
    }
    .desc {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .actions .btn { padding: 7px 12px; font-size: 12px; }
    .history {
      margin-top: 12px;
      border-top: 1px solid #fff3e0;
      padding-top: 10px;
      display: none;
    }
    .history.show { display: block; }
    .history h4 {
      margin: 0 0 8px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }
    .history ul { margin: 0; padding: 0; }
    .history li {
      list-style: none;
      font-size: 12px;
      color: var(--text);
      padding: 7px 0;
      border-bottom: 1px solid #fff8e1;
      line-height: 1.45;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 12px;
      border: 1px dashed var(--border);
      border-radius: 16px;
      background: #fff;
      margin-bottom: 12px;
    }
    .footer {
      text-align: center;
      padding: 24px 8px 10px;
      font-size: 11px;
      color: #bbb;
      line-height: 1.7;
    }
    .footer a { color: #b8860b; text-decoration: none; font-weight: 600; }
    .footer a:hover { text-decoration: underline; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: var(--secondary);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      z-index: 20;
      max-width: 90vw;
      box-shadow: 0 8px 20px rgba(0,0,0,.15);
    }
    .toast.show { opacity: 1; }
    .err { color: var(--up); font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <a class="home-link" href="https://guguji.icu">← 返回主页</a>
      <h1>🐤 QDII 额度监控</h1>
      <div class="sub">
        跟踪基金「申购状态 + 单日累计申购上限」（东财口径）。状态/限额变化会记录时间线。<br/>
        非代销渠道剩余库存；仅作提醒工具，不构成投资建议。
      </div>
    </div>

    <div class="card toolbar">
      <input id="codeInput" type="text" inputmode="numeric" maxlength="6" placeholder="输入6位基金代码，如 016664" />
      <button id="addBtn" class="btn" type="button">添加自选</button>
      <button id="refreshBtn" class="btn secondary" type="button">刷新全部</button>
    </div>

    <div class="meta">
      <span id="statusText" class="status-pill">准备就绪</span>
      <span id="apiText" class="status-pill"></span>
    </div>

    <div id="list" class="list"></div>
    <div id="empty" class="empty" hidden>还没有自选，先添加一只 QDII 基金吧</div>

    <div class="footer">
      数据源：东方财富 FundMNBasicInformation（服务端代理 ocr.guguji.icu）· 缓存约 60 秒<br/>
      估值工具：<a href="https://ji.guguji.icu" target="_blank" rel="noopener">ji.guguji.icu</a>
      · 本页域名：qdii.guguji.icu · v0.1.1
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    const API_BASE = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
      ? "http://127.0.0.1:5000"
      : "https://ocr.guguji.icu";
    const STORAGE_KEY = "qdii_watchlist_v1";
    const DEFAULT_CODES = ["016664", "539002"];

    const $ = (id) => document.getElementById(id);
    const listEl = $("list");
    const emptyEl = $("empty");
    const statusText = $("statusText");
    const apiText = $("apiText");
    const toastEl = $("toast");

    apiText.textContent = API_BASE.replace("https://", "");

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    function setStatus(msg, kind) {
      statusText.textContent = msg;
      statusText.classList.remove("ok", "warn");
      if (kind) statusText.classList.add(kind);
    }

    function loadWatchlist() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [...DEFAULT_CODES];
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr) || !arr.length) return [...DEFAULT_CODES];
        return arr.filter((c) => /^\d{6}$/.test(c));
      } catch {
        return [...DEFAULT_CODES];
      }
    }

    function saveWatchlist(codes) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(codes));
    }

    let watchlist = loadWatchlist();
    const historyOpen = new Set();

    function formatAmountCompact(amount) {
      if (amount === null || amount === undefined || amount === "") return null;
      const n = Number(amount);
      if (!Number.isFinite(n)) return String(amount);
      if (n === 0) return "0";
      if (n >= 10000 && n % 10000 === 0) return String(n / 10000) + "万";
      if (Number.isInteger(n)) return String(n);
      return n.toFixed(2).replace(/\.?0+$/, "");
    }

    function formatLimit(amount, norm) {
      if (norm === "paused") return { main: "暂停申购", unit: "" };
      if (amount === null || amount === undefined) {
        if (norm === "open") return { main: "基本开放", unit: "无明确上限" };
        return { main: "—", unit: "" };
      }
      if (amount === 0) return { main: "0", unit: "元" };
      if (amount >= 10000 && amount % 10000 === 0) {
        return { main: String(amount / 10000), unit: "万元" };
      }
      const n = Number(amount);
      const s = Number.isInteger(n) ? String(n) : n.toFixed(2);
      return { main: s, unit: "元" };
    }

    function badgeClass(norm) {
      if (norm === "open") return "open";
      if (norm === "limit") return "limit";
      if (norm === "paused") return "paused";
      return "unknown";
    }

    // 黄色/状态徽章：限大额直接显示金额（1000 / 100 / 1万）
    function badgeText(item) {
      const norm = item.sgzt_norm;
      const compact = formatAmountCompact(item.limit_amount);

      if (norm === "paused") return "暂停";
      if (norm === "open" && compact == null) return "开放";
      if (compact != null) return compact;
      if (norm === "limit") return "限大额";
      if (norm === "open") return "开放";
      if (item.sgzt) return item.sgzt;
      return "未知";
    }

    async function fetchBatch(codes, refresh = false) {
      const q = new URLSearchParams({ codes: codes.join(",") });
      if (refresh) q.set("refresh", "1");
      const res = await fetch(`${API_BASE}/api/qdii/batch?${q}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "batch failed");
      return data.items || [];
    }

    async function fetchHistory(code) {
      const res = await fetch(`${API_BASE}/api/qdii/${code}/history?limit=20`, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "history failed");
      return data.items || [];
    }

    function render(items) {
      const map = new Map(items.map((i) => [i.code, i]));
      listEl.innerHTML = "";
      emptyEl.hidden = watchlist.length > 0;
      if (!watchlist.length) return;

      for (const code of watchlist) {
        const item = map.get(code) || { code, ok: false, error: "无数据" };
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.code = code;

        if (item.error || item.ok === false) {
          card.innerHTML = `
            <div class="row1">
              <div>
                <div class="name">加载失败</div>
                <div class="code">${code}</div>
              </div>
              <span class="badge unknown">错误</span>
            </div>
            <div class="err">${escapeHtml(item.error || "unknown error")}</div>
            <div class="actions">
              <button type="button" class="btn" data-act="retry">重试</button>
              <button type="button" class="btn danger" data-act="remove">移除</button>
            </div>`;
        } else {
          const lim = formatLimit(item.limit_amount, item.sgzt_norm);
          const bc = badgeClass(item.sgzt_norm);
          card.innerHTML = `
            <div class="row1">
              <div>
                <div class="name">${escapeHtml(item.name || "未知基金")}</div>
                <div class="code">${code}${item.ftype ? " · " + escapeHtml(item.ftype) : ""}</div>
              </div>
              <span class="badge ${bc}" title="${escapeHtml(item.sgzt || item.sgzt_norm || "")}">${escapeHtml(badgeText(item))}</span>
            </div>
            <div class="limit-num">${escapeHtml(lim.main)}<small>${escapeHtml(lim.unit)}</small></div>
            <div class="desc">${escapeHtml(item.limit_text || item.sgzt || "")}</div>
            <div class="desc">更新：${escapeHtml(item.updated_at || "-")}${item.cached ? " · 缓存" : ""}${item.source ? " · " + escapeHtml(item.source) : ""}</div>
            <div class="actions">
              <button type="button" class="btn secondary" data-act="history">变更记录</button>
              <button type="button" class="btn secondary" data-act="retry">刷新</button>
              <a href="https://ji.guguji.icu" target="_blank" rel="noopener" style="text-decoration:none">
                <button type="button" class="btn ghost">估值</button>
              </a>
              <button type="button" class="btn danger" data-act="remove">移除</button>
            </div>
            <div class="history ${historyOpen.has(code) ? "show" : ""}" data-history></div>`;
        }

        card.addEventListener("click", async (ev) => {
          const btn = ev.target.closest("button[data-act]");
          if (!btn) return;
          const act = btn.dataset.act;
          if (act === "remove") {
            watchlist = watchlist.filter((c) => c !== code);
            saveWatchlist(watchlist);
            toast("已移除 " + code);
            await refreshAll(false);
          } else if (act === "retry") {
            await refreshOne(code);
          } else if (act === "history") {
            const box = card.querySelector("[data-history]");
            if (historyOpen.has(code)) {
              historyOpen.delete(code);
              box.classList.remove("show");
              return;
            }
            historyOpen.add(code);
            box.classList.add("show");
            box.innerHTML = "<h4>变更记录</h4><div class='desc'>加载中…</div>";
            try {
              const rows = await fetchHistory(code);
              if (!rows.length) {
                box.innerHTML = "<h4>变更记录</h4><div class='desc'>暂无历史（首次观察会记一条基线）</div>";
              } else {
                const lis = rows.map((r) => {
                  const lim = r.limit_amount == null ? "无上限/开放" : (r.limit_amount + "元");
                  const prev = r.prev_sgzt != null
                    ? `（前：${r.prev_sgzt || "-"} / ${r.prev_limit_amount == null ? "-" : r.prev_limit_amount + "元"}）`
                    : "";
                  return `<li>${escapeHtml(r.changed_at || "")} · ${escapeHtml(r.sgzt || r.sgzt_norm || "")} · ${escapeHtml(String(lim))} ${escapeHtml(prev)}</li>`;
                }).join("");
                box.innerHTML = `<h4>变更记录</h4><ul>${lis}</ul>`;
              }
            } catch (e) {
              box.innerHTML = `<h4>变更记录</h4><div class="err">${escapeHtml(e.message)}</div>`;
            }
          }
        });

        listEl.appendChild(card);
      }
    }

    function escapeHtml(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    async function refreshAll(force = true) {
      if (!watchlist.length) {
        render([]);
        setStatus("自选为空");
        return;
      }
      setStatus("刷新中…");
      $("refreshBtn").disabled = true;
      try {
        const items = await fetchBatch(watchlist, force);
        render(items);
        setStatus("已更新 " + new Date().toLocaleTimeString(), "ok");
      } catch (e) {
        setStatus("刷新失败: " + e.message, "warn");
        toast("刷新失败: " + e.message);
        render(watchlist.map((code) => ({ code, ok: false, error: e.message })));
      } finally {
        $("refreshBtn").disabled = false;
      }
    }

    async function refreshOne(code) {
      setStatus("刷新 " + code + "…");
      try {
        const res = await fetch(`${API_BASE}/api/qdii/${code}?refresh=1`, { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "failed");
        await refreshAll(false);
        toast(code + " 已刷新");
      } catch (e) {
        toast("刷新失败: " + e.message);
        setStatus("刷新失败", "warn");
      }
    }

    $("addBtn").addEventListener("click", async () => {
      const code = $("codeInput").value.trim();
      if (!/^\d{6}$/.test(code)) {
        toast("请输入6位基金代码");
        return;
      }
      if (watchlist.includes(code)) {
        toast("已在自选中");
        return;
      }
      watchlist.unshift(code);
      saveWatchlist(watchlist);
      $("codeInput").value = "";
      await refreshAll(true);
      toast("已添加 " + code);
    });

    $("codeInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("addBtn").click();
    });
    $("refreshBtn").addEventListener("click", () => refreshAll(true));

    // boot
    refreshAll(true);
    // soft auto refresh every 3 min
    setInterval(() => refreshAll(false), 180000);
  </script>
</body>
</html>
